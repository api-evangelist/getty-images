scopes: []
docs: https://developer.gettyimages.com/docs/authorization/
finding: 'Getty Images declares OAuth 2.0 but publishes NO SCOPES. The live RFC 8414 document at https://api.gettyimages.com/.well-known/oauth-authorization-server
  carries no scopes_supported member, and the live OpenAPI 3.0.4 declares an EMPTY scopes map on all three oauth2
  flows (password, clientCredentials, authorizationCode). The authorization docs describe grants, PKCE and token
  handling in detail and never mention a scope. Authorization is granted by LICENCE AGREEMENT — what an account
  may download, which products it holds, and whether it has a Gen AI licence — resolved server-side from the Api-Key,
  not negotiated per request. This is a real finding, not a gap in the harvest: there is no scopes reference page
  to search for and no permissions catalogue to enumerate. An agent cannot request least privilege here; it gets
  the whole of whatever the key is entitled to.'
scope_count: 0
