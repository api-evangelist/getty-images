- aid: getty-images:getty-images-scim-api
  name: Getty Images SCIM API
  description: Getty Images serves a SCIM 2.0 (RFC 7643 / RFC 7644) user-provisioning surface at https://scim.gettyimages.com/v2
    for enterprise customers who manage Getty Images users from their own identity provider. Supported
    operations are create user, update user attributes and deactivate user, against the core schema urn:ietf:params:scim:schemas:core:2.0:User
    plus the enterprise extension. Authorization is OAuth 2.0 bearer token. The discovery triad — ServiceProviderConfig,
    Schemas and ResourceTypes — is served anonymously; protected resources require a token.
