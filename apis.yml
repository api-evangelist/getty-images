- aid: getty-images:getty-images-mcp-server
  name: Getty Images MCP Server
  description: >-
    The Getty Images MCP Server is a remote Model Context Protocol endpoint at https://mcp.gettyimages.com/v1
    that gives AI agents tools for authenticating with OAuth 2.0, searching images and videos within the
    organization's Getty Images licence agreement, retrieving asset metadata and downloading image and
    video files. Credentials are issued by a Getty Images account representative; calls are throttled
    at 20 queries per second. Getty asks clients not to hard-code tool names or parameters and to discover
    the tool set at call time.
  humanURL: https://developer.gettyimages.com/mcp/
  baseURL: https://mcp.gettyimages.com/v1
  tags:
  - MCP
  - Artificial Intelligence
  - Search
  - Image
  - Video
  tags_raw:
  - MCP
  - AI
