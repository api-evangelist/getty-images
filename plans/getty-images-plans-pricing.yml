tags: [Images, Media, Photos, Videos]
description: >-
  Getty Images publishes NO plans, tiers or prices for its API. This file records that
  absence as the finding, and replaces the 2026-05-04 bulk-sweep scaffold that invented a
  "Free / 1,000 requests a month / 10 rpm" tier Getty has never offered.
plan_count: 0
pricing_published: false
self_service_signup: false
free_tier: false
trial: false
access_model: sales-gated, attached to an existing content licence
evidence:
- url: https://www.gettyimages.com/api
  status: 200
  finding: >-
    The API solutions page is marketing plus an FAQ. Its only calls to action are "Contact
    Us" (https://engage.gettyimages.com/api-contact) and enterprise contact-sales. No price,
    no tier table, no request quota, no overage rate appears anywhere on it.
- url: https://developer.gettyimages.com/docs/
  status: 200
  finding: >-
    "Please contact your Getty Images account rep to discuss API access and licensing
    options." The developer portal has no pricing page and no sign-up form.
- url: https://www.gettyimages.com/plans-and-pricing
  status: 200
  finding: >-
    Getty's published plans-and-pricing page covers CONTENT subscriptions (Premium Access,
    Editorial Subscription, packs and à-la-carte licensing) for the website product. It is not
    API pricing: API access is granted against an existing agreement rather than sold as its
    own SKU. Recorded so a reader does not mistake it for an API price list.
- url: https://developer.gettyimages.com/mcp/
  status: 200
  finding: >-
    Same posture for the MCP server: "API credentials – you will need an API key and secret.
    Please contact your Getty Images account representative to request access."
plans: []
notes: >-
  The published route to access is: existing Getty Images customers ask their Account Manager
  for API access tied to their licence agreement; prospects fill in a contact form and may be
  given a test account. There is no self-service key, no free tier and no published unit
  price. What the API meters is not requests but LICENCE CONSUMPTION — a POST to
  /v3/downloads/{images,videos}/{id} draws against the customer's content agreement, and the
  Generative AI endpoints "may result in the deduction of a credit depending on the terms of
  your license". The commercial unit is the download or the credit, and both are priced in a
  contract rather than in public.
