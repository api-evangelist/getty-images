notes: >-
  Getty Images names C#, NodeJS and PHP as its supported SDKs on the /sdks/ page. Java and
  Ruby SDKs were also published first-party but their GitHub repositories are now ARCHIVED
  and their registry releases predate the live v3 contract, which is a decay signal worth
  recording rather than hiding. There is no first-party Python SDK on PyPI (three candidate
  names all 404), even though the Getty error-handling docs recommend the Python library
  Tenacity for 429 retries.
