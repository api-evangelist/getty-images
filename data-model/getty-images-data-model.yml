  component_schemas: 215
  operation_ids: 0
  in_spec_examples: 0
  fully_qualified_schema_names: true
  note: >-
    A large fraction of schema names are the .NET fully-qualified type names leaked by the
    generator — e.g.
    GettyImages.Services.Connect.Public.Controllers.Search.Model.CreativeImagesFieldValues.
    That is a real, harvestable observation about contract quality, not a defect introduced
