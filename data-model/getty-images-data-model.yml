identifiers:
  style: opaque numeric strings
  note: >-
    Getty uses no type-prefixed identifiers (no img_, no gen_). Asset ids are numeric strings
    ("83454800", "3231670"); generation request ids and file registration ids are opaque
    strings; board ids are opaque strings. Because ids carry no type tag, an agent cannot
    tell an image id from a video id from the value alone — the endpoint chosen decides the
    interpretation, and GET /v3/images/{id} with a video id returns 404 ImageNotFound.
  caveat: >-
    order_id on GET /v3/purchased-assets is emitted as a 32-bit integer in string form and is
    being loosened to a pure string; see the 2026-03-02 release note.
