openapi: 3.2.0
info:
  title: Getty Images Purchases API
  version: '3'
security:
- Api-Key: []
- OAuth2: []
tags:
- name: Purchases
paths:
  /v3/purchased-assets:
    get:
      tags:
      - Purchases
      summary: Get Previously Purchased Images and Video
      description: 'This endpoint returns a list of all assets purchased on gettyimages.com by the username used for authentication.

        Use of this endpoint requires configuration changes to your API key. Please contact your sales representative

        to learn more.


        You''ll need an API key and access token to use this resource.'
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: date_to
        in: query
        description: If specified, retrieves previous purchases on or before this date. Dates should be submitted in ISO 8601 format (i.e., YYYY-MM-DD).
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        description: Identifies page to return. Default is 1.
        schema:
          type: integer
          format: int32
          default: 1
      - name: page_size
        in: query
        description: Specifies page size. Default is 75, maximum page_size is 100.
        schema:
          type: integer
          format: int32
          default: 75
      - name: date_from
        in: query
        description: If specified, retrieves previous purchases on or after this date. Dates should be submitted in ISO 8601 format (i.e., YYYY-MM-DD).
        schema:
          type: string
          format: date-time
      - name: company_purchases
        in: query
        description: If specified, returns the list of previously purchased assets for all users in your company. Your account must be enabled for this functionality. Contact your Getty Images account rep for more information. Default is false.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Models.Purchases.PreviousAssetPurchases'
        '401':
          description: Unauthorized
        '400':
          description: PageNumberLessThanOne
        '403':
          description: InsufficientPermissions
      operationId: getV3PurchasedAssets
      x-operation-id-source: derived
components:
  schemas:
    GettyImages.Services.Connect.Public.Models.Purchases.PreviousAssetPurchases:
      type: object
      properties:
        result_count:
          type: integer
          format: int32
        previous_purchases:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Models.Purchases.PreviousAssetPurchase'
      additionalProperties: false
    GettyImages.Services.Connect.Public.Models.Purchases.PreviousAssetPurchase:
      type: object
      properties:
        date_purchased:
          type: string
          format: date-time
        purchased_by:
          type:
          - string
          - 'null'
        asset_id:
          type:
          - string
          - 'null'
        asset_type:
          type:
          - string
          - 'null'
        license_model:
          type:
          - string
          - 'null'
        order_id:
          type:
          - string
          - 'null'
        thumb_uri:
          type:
          - string
          - 'null'
        size_name:
          type:
          - string
          - 'null'
        file_size_in_bytes:
          type:
          - string
          - 'null'
        download_uri:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Api-Key:
      type: apiKey
      name: Api-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        password:
          tokenUrl: https://authentication.gettyimages.com/oauth2/token
          refreshUrl: https://authentication.gettyimages.com/oauth2/token
          scopes: {}
        clientCredentials:
          tokenUrl: https://authentication.gettyimages.com/oauth2/token
          scopes: {}
        authorizationCode:
          authorizationUrl: https://authentication.gettyimages.com/oauth2/auth
          tokenUrl: https://authentication.gettyimages.com/oauth2/token
          refreshUrl: https://authentication.gettyimages.com/oauth2/token
          scopes: {}
