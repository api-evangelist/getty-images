openapi: 3.2.0
info:
  title: Getty Images Orders API
  version: '3'
  description: 'Operations tagged Orders across 2 of this provider''s published API definitions: getty-images-openapi.yml, getty-images-swagger-v3-openapi.json. Each path carries the servers of the definition it was published in.'
security:
- Api-Key: []
- OAuth2: []
tags:
- name: Orders
paths:
  /v3/orders/{id}:
    get:
      tags:
      - Orders
      summary: Get order metadata
      description: 'This endpoint returns detailed order metadata for a specified order.

        Use of this endpoint requires configuration changes to your API key.


        You''ll need an API key and access token to use this resource.'
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: id
        in: path
        description: An order id.
        required: true
        schema:
          type: integer
          description: An order id.
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          description: Unauthorized
        '403':
          description: NoAccessToOrderMetadata
        '404':
          description: OrderNotFound
      operationId: getV3OrdersById
      x-operation-id-source: derived
