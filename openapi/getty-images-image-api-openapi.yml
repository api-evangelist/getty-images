  /v3/ai/image-generations/{generationRequestId}/images/{index}/download:
    put:
      tags:
      - Image
      summary: Begin the download process
      description: '# AI Generator - Download Image


        Download a generated image. Initiating the download process for a 4K file may incur a cost depending on the terms of your agreement.


        ## Download Image Request body details


        The `ImageDownloadRequest` payload to be posted contains the required `size` as well as some other optional

        parameters:


        | Parameter         | Purpose                                                                                      |

        |-------------------|----------------------------------------------------------------------------------------------|

        | `size_name` _Required_ | Must be one of the valid download sizes retrieved through the "Get Download Sizes" endpoint |

        | `notes`             | This is an optional free text parameter often used by clients who wish to include notes specific to their integration. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information.                                                                                                                                       |

        | `project_code`      | If your Getty Images Generative AI product requires project_codes, use of this parameter is required. If your product does not require a project_code, this parameter must be excluded from the request. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information.                                                                                                                  |


        ## Fulfilled and Pending Results


        In many cases the result of this call will be the final fulfilled result. In these cases, you will see a `HTTP 200 OK`

        result and a payload including a URL for the download.


        However some generations may take more time than can be accommodated in the initial call. In these cases the result of

        this call is `HTTP 202 Accepted` with no payload. This client should then

        poll `GET v3/ai/image-generations/{generationRequestId}/images/{index}/download` periodically to get the final

        download.

        '
      parameters:
      - name: generationRequestId
        in: path
        description: The ID from a previous request to generate images
        required: true
        style: simple
        schema:
          type: string
      - name: index
        in: path
        description: The index of the image from the specific images generation
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageDownloadRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ImageDownloadRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ImageDownloadRequest'
      responses:
        '200':
          description: Download request was successful and is complete
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
        '202':
          description: Download request was successful put is pending
        '400':
          description: InvalidProduct
        '403':
          description: ProductQuotaExceeded
        '404':
          description: GenerationRequestIdNotFound
        '409':
          description: A download is already in progress for the given `generationRequestId` and `index`.
        '410':
          description: GenerationRequestGone
    get:
      tags:
      - Image
      summary: "Once the download process has started, this endpoint can be used to check the status of the download and get the\r\ndownload URL once it is completed."
      description: '# AI Generator - Get Download Image


        Get the download for a generated image


        ## Fulfilled and Pending Results


        In many cases the result of this call will be the final fulfilled result. In these cases, you will see a `HTTP 200 OK`

        result and a payload including a URL for the download.


        However some generations may take more time than can be accommodated in the initial call. In these cases the result of

        this call is `HTTP 202 Accepted` with no payload. This client should then

        poll `GET v3/ai/image-generations/{generationRequestId}/images/{index}/download` periodically to get the final

        download.


        Like the `PUT v3/ai/image-generations/{generationRequestId}/images/{index}/download` endpoint, the result of calling

        this endpoint will be either:


        - `HTTP 200 OK` with the download URL

        - `HTTP 202 Accepted` with no payload


        `HTTP 202 Accepted` is returned in the case where the download preparation has not yet completed. In this case it is

        expected that the client will occasionally poll this endpoint until a `HTTP 200 OK` result with a full payload is

        returned.

        '
      parameters:
      - name: generationRequestId
        in: path
        description: The ID from a previous request to generate images
        required: true
        style: simple
        schema:
          type: string
      - name: index
        in: path
        description: The index of the image from the specific images generation
        required: true
        style: simple
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Download request was successful and is complete
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'
        '202':
          description: Download request was successful put is pending
        '400':
          description: InvalidProduct
        '404':
          description: GenerationRequestIdNotFound
        '410':
          description: GenerationRequestGone
  /v3/search/images/creative/by-image:
    get:
      tags:
      - Image
      summary: Search for creative images based on url
      description: 'Search for **similar creative images** by passing an `image_url` to an uploaded image OR an `asset_id` of an asset in our catalog.  All responses will have the `exclude_nudity` filter automatically applied.


        ## Searching by URL


        Before calling the search by image endpoint, an image in JPEG format must be uploaded to `https://api.gettyimages.com/v3/search/by-image/uploads/{CLIENT_IMAGE.jpg}`, where the client defines the `{CLIENT_IMAGE.jpg}` portion of the URL.


        For example, using cURL:


        ``` sh

        curl -i -X PUT https://api.gettyimages.com/v3/search/by-image/uploads/my-test-image.jpg -H ''Content-Type: image/jpeg'' -H ''Api-Key: API_KEY'' --data-binary "@testimage.jpg"

        ```


        Once the image has been uploaded, use the full URL in the `image_url` parameter, e.g. `image_url=https://api.gettyimages.com/v3/search/by-image/uploads/my-test-image.jpg`.


        - Uploaded files must be 10MB or smaller.

        - Uploads to the same URL will overwrite each other, so ensure that the client application is handling naming uniqueness appropriately.

        - Uploads expire after 24 hours.

        - Uploads and searches must be performed using the _same_ API Key.


        ## Searching by asset id


        When searching by `asset_id`, any image or video asset id in the Getty/iStock catalog can be used as the source for similar images.

        '
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: GI-Country-Code
        in: header
        description: Receive regionally relevant search results based on the value specified. Accepts only ISO Alpha-3 country codes. The Countries operation can be used to retrieve the codes.
        schema:
          type: string
          description: Use of this parameter requires configuration changes to your API key. Please contact your sales representative to learn more.
      - name: asset_id
        in: query
        description: Specifies the Getty image id to use in the search.
        schema:
          type: string
          description: Specifies the Getty image id to use in the search.
          nullable: true
      - name: exclude_editorial_use_only
        in: query
        description: Exclude images that are only available for editorial (non-commercial) use. Default value is false.
        schema:
          type: boolean
          description: Exclude images that are only available for editorial (non-commercial) use. Default value is false.
          nullable: true
      - name: facet_fields
        in: query
        description: "Specifies the facets to return in the response. Facets provide additional search parameters to refine your results.\r\n                    The include_facets parameter must be set to \"true\" for facets to be returned."
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/CreateImageSearchFacetsFields'
          description: "Specifies the facets to return in the response. Facets provide additional search parameters to refine your results.\r\n                    The include_facets parameter must be set to \"true\" for facets to be returned."
          nullable: true
      - name: facet_max_count
        in: query
        description: Specifies the maximum number of facets to return per type. Default is 300.
        schema:
          type: integer
          description: Specifies the maximum number of facets to return per type. Default is 300.
          format: int32
          default: 300
      - name: fields
        in: query
        description: 'Specifies fields to return. Defaults to ''summary_set''. NOTE: Bytes, height, and width returned by ''download_sizes'' field are estimates.'
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/CreativeImagesFieldValues'
          description: 'Specifies fields to return. Defaults to ''summary_set''. NOTE: Bytes, height, and width returned by ''download_sizes'' field are estimates.'
          nullable: true
      - name: image_url
        in: query
        description: Specifies the location of the image to use in the search.
        schema:
          type: string
          description: Specifies the location of the image to use in the search.
          nullable: true
      - name: include_facets
        in: query
        description: Specifies whether or not to include facets in the result set. Default is "false".
        schema:
          type: boolean
          description: Specifies whether or not to include facets in the result set. Default is "false".
          nullable: true
      - name: page
        in: query
        description: Request results starting at a page number (default is 1).
        schema:
          type: integer
          description: Request results starting at a page number (default is 1).
          format: int32
          default: 1
      - name: page_size
        in: query
        description: Request number of images to return in each page. Default is 30, maximum page_size is 100.
        schema:
          type: integer
          description: Request number of images to return in each page. Default is 30, maximum page_size is 100.
          format: int32
          default: 30
      - name: phrase
        in: query
        description: Free-text search query.
        schema:
          type: string
          description: Free-text search query.
          default: ''
          nullable: true
      - name: product_types
        in: query
        description: "Filter images to those from one of your product types. \r\n                    Allowed values are easyaccess, imagepack, premiumaccess and royaltyfreesubscription. \r\n                    If you have more than one instance of a product, you may also include the ID of the product instance you wish to filter on. \r\n                    For example, some users may have more than one premiumaccess product, so the product_types value would be premiumaccess:1234. \r\n                    Product ID can be obtained from the GET /products response."
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          description: "Filter images to those from one of your product types. \r\n                    Allowed values are easyaccess, imagepack, premiumaccess and royaltyfreesubscription. \r\n                    If you have more than one instance of a product, you may also include the ID of the product instance you wish to filter on. \r\n                    For example, some users may have more than one premiumaccess product, so the product_types value would be premiumaccess:1234. \r\n                    Product ID can be obtained from the GET /products response."
          nullable: true
      responses:
