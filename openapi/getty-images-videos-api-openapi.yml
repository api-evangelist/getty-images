components:
  schemas:
    AssetDownloadHistoryResults:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        downloads: {}
      additionalProperties: false
    VideoDetailFieldValues:
      enum:
      - id
      - allowed_use
      - artist
      - asset_family
      - call_for_image
      - caption
      - city
      - clip_length
      - collection_code
      - collection_id
      - collection_name
      - color_type
      - comp
      - copyright
      - country
      - date_created
      - date_submitted
      - detail_set
      - display_set
      - download_sizes
      - download_product
      - downloads
      - editorial_segments
      - entity_details
      - era
      - event_ids
      - is_ai_editable
      - istock_collection
      - istock_licenses
      - key_frames
