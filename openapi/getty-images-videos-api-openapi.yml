openapi: 3.2.0
info:
  title: Getty Images Videos API
  version: '3'
  description: 'Operations tagged Videos across 2 of this provider''s published API definitions: getty-images-openapi.yml, getty-images-swagger-v3-openapi.json. Each path carries the servers of the definition it was published in.'
security:
- Api-Key: []
- OAuth2: []
tags:
- name: Videos
paths:
  /v3/videos:
    get:
      tags:
      - Videos
      summary: Get metadata for multiple videos by supplying multiple video ids
      description: 'Use this endpoint to return detailed video metadata for all the specified video ids.


        You''ll need an API key and access token to use this resource.


        You can show different information in the response by specifying values on the "fields" parameter (see details below).

        You can search with only an API key, and that will give you search results that are equivalent to doing a search on the GettyImages.com site without being logged in (anonymous search). If you are a Getty Images API customer and would like to ensure that your API searches return only assets that you have a license to use, you need to also include an authorization token in the header of your request. Please consult our Authorization FAQ for more information on authorization tokens, and our Authorization Workflows for code examples of getting a token.


        ## Working with Fields Sets


        Fields sets are used in the **fields** request parameter to receive a suite of metadata fields. The following fields sets are available:


        #### Summary Fields Set


        The **summary_set** query string parameter fields value represents a small batch of metadata fields that are often used to build search response results. The following fields are provided for every video in your result set when you include **summary_set** in your request.


        ```

        {

        "videos":

        [

        "asset_family",

        "caption",

        "collection_code",

        "collection_name",

        "display_sizes":

        [

        {

        "name": "comp"

        },

        {

        "name": "preview"

        },

        {

        "name": "thumb"

        }

        ],

        "license_model",

        "title"

        ]

        }

        ```


        #### Detail Fields Set


        The **detail_set** query string parameter fields value represents a large batch of metadata fields that are often used to build a detailed view of videos. The following fields are provided for every video in your result set when you include **detail_set** in your request.


        ```

        {

        "videos":

        [

        "allowed_use",

        "artist",

        "asset_family",

        "call_for_image",

        "caption",

        "clip_length",

        "collection_code",

        "collection_id",

        "collection_name",

        "color_type",

        "copyright",

        "date_created",

        "display_sizes":

        [

        {

        "name": "comp"

        },

        {

        "name": "preview"

        },

        {

        "name": "thumb"

        }

        ],

        "download_sizes",

        "era",

        "event_ids",

        "license_model",

        "mastered_to",

        "originally_shot_on",

        "product_types",

        "quality_rank",

        "shot_speed",

        "source",

        "title"

        ]

        }

        ```


        #### Display Fields Set


        The **display_set** query string parameter fields value represents the fields that provide you with URLs for the low resolution files that are most frequently used to build a UI displaying search results. The following fields are provided for every video in your result set when you include **display_set** in your request.


        The URI provided is subject to change at any time and must be used as-is with no modification.


        ```

        {

        "videos":

        [

        {

        "display_sizes":

        [

        {

        "is_watermarked": ,

        "name": "comp",

        "uri": ""

        },

        {

        "is_watermarked": ,

        "name": "preview",

        "uri": ""

        },

        {

        "is_watermarked": ,

        "name": "thumb",

        "uri": ""

        }

        ],

        "key_frames": [

        {

        "uri": ""

        },

        {

        "uri": ""

        },

        {

        "uri": ""

        },

        {

        "uri": ""

        },

        {

        "uri": ""

        }

        ]

        }

        ]

        }

        ```


        ## Request Usage Considerations


        - Specifying the "entity_details" response field can have significant performance implications. The field should be used only when necessary.'
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: ids
        in: query
        description: Specifies one or more video ids to return. Use comma delimiter when requesting multiple ids.  Maximum of 100 ids.
        style: form
        explode: false
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Specifies one or more video ids to return. Use comma delimiter when requesting multiple ids.  Maximum of 100 ids.
      - name: fields
        in: query
        description: 'Specifies fields to return. Defaults to ''summary_set''. NOTE: Bytes returned by ''download_sizes'' field is an estimate.'
        style: form
        explode: false
        schema:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VideoDetailFieldValues'
          description: 'Specifies fields to return. Defaults to ''summary_set''. NOTE: Bytes returned by ''download_sizes'' field is an estimate.'
      responses:
        '200':
          description: OK
        '400':
          description: InvalidParameterValue
        '401':
          description: AuthorizationTokenRequired
        '403':
          description: UnauthorizedDisplaySize
        '404':
          description: VideosNotFound
        '500':
          description: InvalidIStockCollection
      operationId: getV3Videos
      x-operation-id-source: derived
