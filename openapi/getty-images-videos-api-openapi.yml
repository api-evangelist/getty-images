      - name: id
        in: path
        description: A video id.
        required: true
        schema:
          type:
          - string
          - 'null'
          description: A video id.
      - name: company_downloads
        in: query
        description: "If specified, returns the list of previously downloaded videos for all users in your company.\n            Your account must be enabled for this functionality. Contact your Getty Images account rep for more information. Default is false."
        schema:
          type: boolean
          description: "If specified, returns the list of previously downloaded videos for all users in your company.\n            Your account must be enabled for this functionality. Contact your Getty Images account rep for more information. Default is false."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDownloadHistoryResults'
        '400':
          description: Bad request
        '401':
          description: AuthorizationTokenRequired
        '403':
          description: UnauthorizedDisplaySize
        '404':
          description: VideosNotFound
        '500':
          description: InvalidIStockCollection
      operationId: getV3VideosByIdDownloadhistory
      x-operation-id-source: derived
