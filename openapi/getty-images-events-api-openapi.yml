openapi: 3.2.0
info:
  title: Getty Images Events API
  version: '3'
  description: 'Operations tagged Events across 2 of this provider''s published API definitions: getty-images-openapi.yml, getty-images-swagger-v3-openapi.json. Each path carries the servers of the definition it was published in.'
security:
- Api-Key: []
- OAuth2: []
tags:
- name: Events
paths:
  /v3/events:
    get:
      tags:
      - Events
      summary: Get metadata for multiple events
      description: 'This endpoint returns the detailed event metadata for all specified events. Getty Images news, sports and entertainment photographers and

        videographers cover editorially relevant events occurring around the world. All images or video clips produced in association with

        an event, are assigned the same EventID. EventIDs are part of the meta-data returned in SearchForImages Results. Only content

        produced under a Getty Images brand name (Getty Images News, Getty Images Sports, Getty Images Entertainment, Film Magic, Wire Image)

        will be consistently assigned an EventID. The Event framework may also be used to group similar content, such as

        "Hats from the Royal Wedding" or "Odd-ballOffbeat images of the week".


        You''ll need an API key and access token to use this resource.'
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: ids
        in: query
        description: A comma separated list of event ids.
        style: form
        explode: false
        schema:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: A comma separated list of event ids.
      - name: fields
        in: query
        description: A comma separated list of fields to return in the response.
        style: form
        explode: false
        schema:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EventDetailFieldValues'
          description: A comma separated list of fields to return in the response.
      responses:
        '200':
          description: OK
        '400':
          description: InvalidRequestParameters
        '401':
          description: Unauthorized
        '404':
          description: EventNotFound
      operationId: getV3Events
      x-operation-id-source: derived
  /v3/events/{id}:
    get:
      tags:
      - Events
      summary: Get metadata for a single event
      description: 'This endpoint returns the detailed event metadata for a specified event. Getty Images news, sports and entertainment

        photographers and videographers cover editorially relevant events occurring around the world.

        All images or video clips produced in association with an event, are assigned the same EventID.

        EventIDs are part of the meta-data returned in SearchForImages Results. Only content produced under a Getty Images

        brand name (Getty Images News, Getty Images Sports, Getty Images Entertainment, Film Magic, Wire Image) will be

        consistently assigned an EventID. The Event framework may also be used to group similar content, such as

        "Hats from the Royal Wedding" or "Odd-ballOffbeat images of the week".


        You''ll need an API key and access token to use this resource.'
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: id
        in: path
        description: An event id.
        required: true
        schema:
          type: integer
          description: An event id.
          format: int32
      - name: fields
        in: query
        description: A comma separated list of fields to return in the response.
        style: form
        explode: false
        schema:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EventDetailFieldValues'
          description: A comma separated list of fields to return in the response.
      responses:
        '200':
          description: OK
        '400':
          description: InvalidRequestParameters
        '401':
          description: Unauthorized
        '404':
          description: EventNotFound
      operationId: getV3EventsById
      x-operation-id-source: derived
