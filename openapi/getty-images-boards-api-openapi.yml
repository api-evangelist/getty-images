components:
  schemas:
    Asset:
      type: object
      properties:
        id:
          type: string
          nullable: true
        asset_type:
          type: string
          nullable: true
        date_added:
          type: string
          format: date-time
        display_sizes:
          type: array
          items:
            $ref: '#/components/schemas/DisplaySize'
          nullable: true
      additionalProperties: false
    BoardListBoard:
      type: object
      properties:
        id:
          type: string
          nullable: true
        asset_count:
          type: integer
          format: int32
        date_created:
          type: string
          format: date-time
        date_last_updated:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        hero_asset:
          $ref: '#/components/schemas/Asset'
        name:
          type: string
          nullable: true
        board_relationship:
          type: string
          nullable: true
      additionalProperties: false
    CommentRequest:
      type: object
      properties:
        text:
          type: string
          nullable: true
      additionalProperties: false
    BoardCreated:
      type: object
      properties:
        id:
          type: string
          nullable: true
      additionalProperties: false
    CommentCreated:
      type: object
      properties:
        id:
          type: string
          nullable: true
      additionalProperties: false
    BoardRelationship:
      enum:
      - owned
      - invited
      type: string
    BoardAsset:
      required:
      - asset_id
      type: object
      properties:
        asset_id:
          type: string
      additionalProperties: false
    AddBoardAssetsResult:
      type: object
      properties:
        assets_added:
          type: array
          items:
            $ref: '#/components/schemas/BoardAsset'
          nullable: true
        assets_not_added:
          type: array
          items:
            type: string
          nullable: true
      additionalProperties: false
    BoardSortOrder:
      enum:
      - date_last_updated_descending
      - date_last_updated_ascending
      - name_ascending
      - name_decending
      type: string
    BoardPermissions:
      type: object
      properties:
        can_delete_board:
          type: boolean
        can_invite_to_board:
          type: boolean
        can_update_name:
          type: boolean
        can_update_description:
          type: boolean
        can_add_assets:
          type: boolean
        can_remove_assets:
          type: boolean
      additionalProperties: false
    BoardInfo:
      required:
      - name
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
      additionalProperties: false
    CommentsList:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          nullable: true
        permissions:
          $ref: '#/components/schemas/BoardCommentPermissions'
      additionalProperties: false
    CommentPermissions:
      type: object
      properties:
        can_delete_comment:
          type: boolean
      additionalProperties: false
    DisplaySize:
      type: object
      properties:
        name:
          type: string
          nullable: true
        uri:
          type: string
          nullable: true
      additionalProperties: false
    Collaborator:
      type: object
      properties:
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
      additionalProperties: false
    BoardDetail:
      type: object
      properties:
        id:
          type: string
          nullable: true
        asset_count:
          type: integer
          format: int32
        assets:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
          nullable: true
        date_created:
          type: string
          format: date-time
        date_last_updated:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        comment_count:
          type: integer
          format: int32
        permissions:
          $ref: '#/components/schemas/BoardPermissions'
        links:
          $ref: '#/components/schemas/Links'
      additionalProperties: false
    Links:
      type: object
      properties:
        invitation:
          type: string
          nullable: true
        share:
          type: string
          nullable: true
      additionalProperties: false
    BoardList:
      type: object
      properties:
        boards:
          type: array
          items:
            $ref: '#/components/schemas/BoardListBoard'
          nullable: true
        board_count:
          type: integer
          format: int32
      additionalProperties: false
    BoardCommentPermissions:
      type: object
      properties:
        can_add_comment:
          type: boolean
      additionalProperties: false
    Comment:
      type: object
      properties:
        created_by:
