openapi: 3.2.0
info:
  title: Getty Images AI Generator API
  version: '3'
security:
- Api-Key: []
- OAuth2: []
tags:
- name: AiGenerator
paths:
  /v3/ai/image-generations:
    post:
      tags:
      - AiGenerator
      summary: Generates images from a prompt
      description: '# AI Generator - Generate Images


        Use a text prompt to generate images. Use of this endpoint is restricted to clients with an AI Generation license

        product.


        ## The Image Generations Request


        The `ImageGenerationsRequest` payload to be posted contains the required `prompt` as well as some other optional

        parameters:


        | Parameter | Purpose |

        |---------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

        | `prompt` _Required_ | The primary text used for the generation of the images. |

        | `product_id` | If you have multiple AI Generation Getty Images products, indicate which one you would like to use for this generation request. If you have multiple products, this property is _required_. Can be retrieved from products (`GET /v3/products`). |

        | `notes` | This is an optional free text parameter often used by clients who wish to include notes specific to their integration. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information. |

        | `project_code` | If your Getty Images Generative AI product requires project_codes, use of this parameter is required. If your product does not require a project_code, this parameter must be excluded from the request. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information. |

        | `aspect_ratio` | The "width:height" aspect ratio of the resultant images. Must be one of: `1:1`, `3:4`, `4:3`, `9:16`, or `16:9` |

        | `media_type` | Media type of the results: `photography` or `illustration` |

        | `mood` | Can be `black_and_white`, `warm`, `cool`, `natural`, `vivid`, `dramatic`, or `bold` |


        ## Fulfilled and Pending Results


        In many cases the result of this call will be the final fulfilled result. In these cases, you will see a `HTTP 200 OK`

        result and a payload including URLs to the result images and a generation request `id` value.


        However some generations may take more time than can be accommodated in the initial call. In these cases the result of

        this call is `HTTP 202 Accepted` and the payload will only contain a generation request `id` value. This value must be

        retained by the client for subsequent polling of the `GET v3/ai/image-generations/{generationRequestId}` Get Images Generation endpoint.


        ## Lifetime of Generated Images


        Generated images will be retained for 6 months after generation.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationsRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationsRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ImageGenerationsRequest'
      responses:
        '202':
          description: Returns the request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingImageGenerationResponse'
        '400':
          description: The request was invalid
        '403':
          description: Product quota exceeded
        '409':
          description: ConcurrencyConflict
        '429':
          description: TooManyConcurrentGenerations
      operationId: postV3AiImageGenerations
      x-operation-id-source: derived
  /v3/ai/image-generations/{generationRequestId}:
    get:
      tags:
      - AiGenerator
      summary: Get generated images from a previous generation request
      description: '# AI Generator - Get Generated Images


        Gets a previously generated set of images. This endpoint is used after a call to `POST v3/ai/image-generations`, passing the `id` value from the result of that call.


        ## Fulfilled and Pending Results


        Like the `POST v3/ai/image-generations` endpoint, the result of calling this endpoint will be either:


        - `HTTP 200 OK` with the generated images'' URLs and a generation request `id` value

        - `HTTP 202 Accepted` with the payload only containing a generation request `id` value


        `HTTP 202 Accepted` is returned in the case where the generation of images has not yet completed. In this case it is expected that the client will occasionally poll this endpoint until a `HTTP 200 OK` result with a full payload is returned.


        ## Lifetime of Generated Images


        Generated images will be retained for 6 months after generation.'
      parameters:
      - name: generationRequestId
        in: path
        description: The ID from a previous request to generate images
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Returns the request ID for a pending request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingImageGenerationResponse'
        '200':
          description: Returns the result of a request to generate images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageGenerationsResponse'
        '404':
          description: The request ID was not found
        '409':
          description: ConcurrencyConflict
        '400':
          description: InvalidProduct
        '403':
          description: NoProducts
        '429':
          description: TooManyConcurrentGenerations
        '410':
          description: GenerationRequestGone
      operationId: getV3AiImageGenerationsByGenerationRequestId
      x-operation-id-source: derived
  /v3/ai/image-generations/{generationRequestId}/images/{index}/variations:
    post:
      tags:
      - AiGenerator
      summary: Get variations on a generated image
      description: '# AI Generator - Generate Variations


        Generate image variations from a previously-generated image.


        ## The Image Variation Request


        The `ImageVariationRequest` payload to be posted contains the optional

        parameters:


        | Parameter | Purpose |

        |---------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

        | `product_id` | If you have multiple AI Generation Getty Images products, indicate which one you would like to use for this generation request. If you have multiple products, this property is _required_. Can be retrieved from products (`GET /v3/products`). |

        | `notes` | This is an optional free text parameter often used by clients who wish to include notes specific to their integration. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information. |

        | `project_code` | If your Getty Images Generative AI product requires project_codes, use of this parameter is required. If your product does not require a project_code, this parameter must be excluded from the request. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information. |


        ## Fulfilled and Pending Results


        In many cases the result of this call will be the final fulfilled result. In these cases, you will see a `HTTP 200 OK`

        result and a payload including URLs to the result images and a generation request `id` value.


        However some generations may take more time than can be accommodated in the initial call. In these cases the result of

        this call is `HTTP 202 Accepted` and the payload will only contain a generation request `id` value. This value must be

        retained by the client for subsequent polling of the `GET v3/ai/image-generations/{generationRequestId}` Get Images Generation endpoint.


        ## Lifetime of Generated Images


        Generated images will be retained for 6 months after generation.'
      parameters:
      - name: generationRequestId
        in: path
        description: The ID from a previous request to generate images
        required: true
        schema:
          type: string
      - name: index
        in: path
        description: The index of the image from the specific images generation
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageVariationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ImageVariationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ImageVariationRequest'
      responses:
        '202':
          description: Returns the request ID for a pending request to generate a variation of images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingImageGenerationResponse'
        '400':
          description: The request was invalid
        '403':
          description: Product quota exceeded
        '404':
          description: Either the generation id does not exist, the index is incorrect, or the generation is still pending
        '409':
          description: ConcurrencyConflict
        '429':
          description: TooManyConcurrentGenerations
      operationId: postV3AiImageGenerationsByGenerationRequestIdImagesByIndexVariations
      x-operation-id-source: derived
  /v3/ai/file-registrations:
    post:
      tags:
      - AiGenerator
      summary: Register a client provided file for use with AIGenerator endpoints
      description: '# File Registration


        Provide the URL for a previously uploaded file to receive an ID that can be used as the `reference_file_registration_id` in subsequent image generation requests.


        ## The File Registration Request


        The `FileRegistrationRequest` payload accepts the following

        parameters:


        | Parameter | Purpose |

        |---------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

        | `url` | Required. Specifies the location of the file. | |

        | `rights_claimed`| Required. Acknowledgment that client owns or has a license for this file. | |

        | `category` | Optional. Accepted values: `CustomerProduct`, `ImageReference`. Images to be used in `POST /beta/ai/image-generations/background-generations` must have the category set to `CustomerProduct`. | |


        ## Uploading the file


        Before calling this endpoint, a file must be uploaded to `https://api.gettyimages.com/v3/search/by-image/uploads/{CLIENT_IMAGE.jpg}`, where the client defines the `{CLIENT_IMAGE.jpg}` portion of the URL.


        For example, using cURL:


        ``` sh

        curl -i -X PUT https://api.gettyimages.com/v3/search/by-image/uploads/my-test-image.jpg -H ''Content-Type: image/jpeg'' -H ''Api-Key: API_KEY'' --data-binary "@testimage.jpg"

        ```


        Once the file has been uploaded, use the full URL as the `url`.


        - Uploaded files must be 10MB or smaller.

        - Uploads to the same URL will overwrite each other, so ensure that the client application is handling naming uniqueness appropriately.

        - Uploads expire after 24 hours.

        - Uploads and file registration must be performed using the _same_ API Key.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileRegistrationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/FileRegistrationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FileRegistrationRequest'
      responses:
        '200':
          description: Returns the response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRegistrationResponse'
        '400':
          description: The request was invalid
        '403':
          description: Not authorized
      operationId: postV3AiFileRegistrations
      x-operation-id-source: derived
    get:
      tags:
      - AiGenerator
      parameters:
      - name: page
        in: query
        description: The page number of results.  Default is 1.
        schema:
          type: integer
          format: int32
      - name: page_size
        in: query
        description: The page size of results.  Default is 30.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFileRegistrationsResponse'
        '403':
          description: NotAuthorized
      summary: Get ai file registrations
      x-summary-source: derived
      operationId: getV3AiFileRegistrations
      x-operation-id-source: derived
  /v3/ai/file-registrations/{fileRegistrationId}:
    get:
      tags:
      - AiGenerator
      summary: Get details on a registered file
      description: '# Get Registered File Details


        Gets details for a registered file. This endpoint is used after a call to `POST beta/ai/file-registrations`, passing the `id` value from the result of that call.'
      parameters:
      - name: fileRegistrationId
        in: path
        description: The id from a previous request to register a file
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Returns the response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFileRegistrationResponse'
        '400':
          description: The request was invalid
        '403':
          description: Not authorized
        '404':
          description: FileRegistrationIdNotFound
      operationId: getV3AiFileRegistrationsByFileRegistrationId
      x-operation-id-source: derived
    delete:
      tags:
      - AiGenerator
      summary: Archives a registered file
      parameters:
      - name: fileRegistrationId
        in: path
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '204':
          description: The file was successfully archived
        '404':
          description: The file registration id does not exist
        '403':
          description: Not authorized
      operationId: deleteV3AiFileRegistrationsByFileRegistrationId
      x-operation-id-source: derived
  /v3/ai/image-generations/refine:
    post:
      tags:
      - AiGenerator
      summary: Refine an image
      description: '# AI Generator - Image Refining


        Use a mask image and text prompts to modify content in an image from the Getty Images creative library (excluding certain vectors) or a previously generated image.

        Use of this endpoint is restricted to clients with an AI Generation license product and may result in the deduction of a credit depending on the terms of your license.

        To download a refined image, a traditional license product, such as Premium Access, that provides download access to the original creative image is required.

        Lastly, downloading a refined image requires the client to first download the original image.


        ## The Refine Request


        The `RefineRequest` payload one, and only one, reference image (`reference_asset_id`, `reference_generation`) and accepts the following

        parameters:


        | Parameter | Purpose |

        |---------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

        | `reference_asset_id`| Creative image id to modify. |

        | `reference_generation`| Generation details of image to modify. |

        | `prompt` | Required. The primary text used for refined portion of the images. |

        | `product_id` | If you have multiple AI Generation Getty Images products, indicate which one you would like to use for this generation request. If you have multiple products, this property is _required_. Can be retrieved from products (`GET /v3/products`). |

        | `notes` | This is an optional free text parameter often used by clients who wish to include notes specific to their integration. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information. |

        | `project_code` | If your Getty Images Generative AI product requires project_codes, use of this parameter is required. If your product does not require a project_code, this parameter must be excluded from the request. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information. |

        | `mask_url` | Specifies the location of the mask. | |


        ## Uploading mask image


        When including a mask_url in the request, a mask in JPEG format must first be uploaded to `https://api.gettyimages.com/v3/search/by-image/uploads/{CLIENT_IMAGE.jpg}`, where the client defines the `{CLIENT_IMAGE.jpg}` portion of the URL.


        For example, using cURL:


        ``` sh

        curl -i -X PUT https://api.gettyimages.com/v3/search/by-image/uploads/my-test-image.jpg -H ''Content-Type: image/jpeg'' -H ''Api-Key: API_KEY'' --data-binary "@testimage.jpg"

        ```


        Once the mask has been uploaded, use the full URL as the `mask_url`.


        - Uploaded files must be 10MB or smaller.

        - Uploads to the same URL will overwrite each other, so ensure that the client application is handling naming uniqueness appropriately.

        - Uploads expire after 24 hours.

        - Uploads and refining must be performed using the _same_ API Key.


        ## Fulfilled and Pending Results


        In many cases the result of this call will be the final fulfilled result. In these cases, you will see a `HTTP 200 OK`

        result and a payload including URLs to the result images and a `generation_request_id` value.


        However some generations may take more time than can be accommodated in the initial call. In these cases the result of

        this call is `HTTP 202 Accepted` and the payload will only contain a `generation_request_id` value. This value must be

        retained by the client for subsequent polling of the `GET v3/ai/image-generations/{generationRequestId}` Get Images Generation endpoint.


        ## Lifetime of Generated Images


        Generated images will be retained for 6 months after generation.'
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefineRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RefineRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RefineRequest'
      responses:
        '202':
          description: Returns the request ID for a pending request to refine an image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingImageGenerationResponse'
        '403':
          description: Product quota exceeded
        '404':
          description: Image not found
        '409':
          description: ConcurrencyConflict
        '400':
          description: InvalidProduct
        '410':
          description: GenerationRequestGone
        '429':
          description: TooManyConcurrentGenerations
      operationId: postV3AiImageGenerationsRefine
      x-operation-id-source: derived
  /v3/ai/image-generations/extend:
    post:
      tags:
      - AiGenerator
      summary: Extend an image
      description: '# AI Generator - Image Extension


        Use text prompts and numerical values to extend the content beyond the borders of an image from the Getty Images creative library (excluding certain vectors) or a previously generated image.'
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ExtendRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ExtendRequest'
      responses:
        '202':
          description: Returns the request ID for a pending request to extend an image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingImageGenerationResponse'
        '403':
          description: Product quota exceeded
        '404':
          description: Image not found
        '409':
          description: ConcurrencyConflict
        '400':
          description: InvalidProduct
        '410':
          description: GenerationRequestGone
        '429':
          description: TooManyConcurrentGenerations
      operationId: postV3AiImageGenerationsExtend
      x-operation-id-source: derived
  /v3/ai/image-generations/background-removal:
    post:
      tags:
      - AiGenerator
      summary: Remove a background
      description: '# AI Generator - Background Removal

        Use of this endpoint is restricted to clients with an AI Generation license product and may result in the deduction of a credit depending on the terms of your license.

        When downloading an image generated using a `reference_asset_id`, a traditional license product, such as Premium Access, that provides download access to the original creative image is required. Downloading an image generated using a `reference_asset_id` also requires the client to first download the original image.


        ## The Background Removal Request


        The `BackgroundRemovalRequest` payload requires one, and only one, reference image (`reference_asset_id`, `reference_generation`) and accepts the following optional

        parameters:


        | Parameter | Purpose |

        |---------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

        | `reference_asset_id`| Creative image id to modify. |

        | `reference_generation`| Generation details of image to modify. | |

        | `product_id` | If you have multiple AI Generation Getty Images products, indicate which one you would like to use for this generation request. If you have multiple products, this property is _required_. Can be retrieved from products (`GET /v3/products`). |

        | `notes` | This is an optional free text parameter often used by clients who wish to include notes specific to their integration. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information. |

        | `project_code` | If your Getty Images Generative AI product requires project_codes, use of this parameter is required. If your product does not require a project_code, this parameter must be excluded from the request. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information. | |


        ## Fulfilled and Pending Results


        In many cases the result of this call will be the final fulfilled result. In these cases, you will see a `HTTP 200 OK`

        result and a payload including URLs to the result images and a `generation_request_id` value.


        However some generations may take more time than can be accommodated in the initial call. In these cases the result of

        this call is `HTTP 202 Accepted` and the payload will only contain a `generation_request_id` value. This value must be

        retained by the client for subsequent polling of the `GET v3/ai/image-generations/{generationRequestId}` Get Images Generation endpoint.


        ## Lifetime of Generated Images


        Generated images will be retained for 6 months after generation.'
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackgroundRemovalRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/BackgroundRemovalRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/BackgroundRemovalRequest'
      responses:
        '202':
          description: Returns the request ID for a pending request to extend an image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingImageGenerationResponse'
        '400':
          description: The request was invalid
        '403':
          description: Product quota exceeded
        '404':
          description: Image not found
        '409':
          description: ConcurrencyConflict
        '410':
          description: GenerationRequestGone
        '429':
          description: TooManyConcurrentGenerations
      operationId: postV3AiImageGenerationsBackgroundRemoval
      x-operation-id-source: derived
  /v3/ai/image-generations/object-removal:
    post:
      tags:
      - AiGenerator
      summary: Remove object(s)
      description: '# AI Generator - Object Removal


        Use a mask image to remove object content in a previously generated image or a previously licensed image from the Getty Images creative library. Use of this endpoint is restricted to clients with an AI Generation license product and may result in the deduction of a credit depending on the terms of your license.


        When downloading an image generated using a `reference_asset_id`, a traditional license product, such as Premium Access, that provides download access to the original creative image is required. Downloading an image generated using a `reference_asset_id` also requires the client to first download the original image.


        ## The Remove Object Request


        The `RemoveObjectRequest` payload accepts the following parameters. One, and only one, of either `reference_asset_id` or `reference_generation` must be used. Omitting or including both are invalid.


        | Parameter | Purpose |

        |------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

        | `reference_asset_id` | Creative image id to modify. |

        | `reference_generation` | Generation details of image to modify. | |

        | `mask_url` | **Required**: Specifies the location of the mask. |

        | `product_id` | If you have multiple AI Generation Getty Images products, indicate which one you would like to use for this generation request. If you have multiple products, this property is **required**. Can be retrieved from products (`GET /v3/products`). |

        | `notes` | This is an optional free text parameter often used by clients who wish to include notes specific to their integration. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information. |

        | `project_code` | This is for use by Getty Images customers only (not iStock). If your Getty Images Generative AI product requires project codes, use of this parameter is **required**. Otherwise, this parameter **must be excluded** from the request. The products endpoint (`GET /v3/products`) provides this information. |


        ## Uploading mask image


        Before calling the endpoint, a mask in JPEG format must be uploaded

        to `https://api.gettyimages.com/v3/search/by-image/uploads/{CLIENT_IMAGE.jpg}`, where the client defines

        the `{CLIENT_IMAGE.jpg}` portion of the URL.


        For example, using cURL:


        ``` sh

        curl -i -X PUT https://api.gettyimages.com/v3/search/by-image/uploads/my-test-image.jpg -H ''Content-Type: image/jpeg'' -H ''Api-Key: API_KEY'' --data-binary "@testimage.jpg"

        ```


        Once the mask has been uploaded, use the full URL as the `mask_url`.


        - Uploaded files must be 10MB or smaller.

        - Uploads to the same URL will overwrite each other, so ensure that the client application is handling naming uniqueness

        appropriately.

        - Uploads expire after 24 hours.

        - Uploads and object removal must be performed using the same API Key.


        ## Fulfilled and Pending Results


        In many cases the result of this call will be the final fulfilled result. In these cases, you will see a `HTTP 200 OK` result and a payload including URLs to the result images and a generation request `id` value.


        However some generations may take more time than can be accommodated in the initial call. In these cases the result of this call is `HTTP 202 Accepted` and the payload will only contain a generation request `id` value. This value must be retained by the client for subsequent polling of the `GET v3/ai/image-generations/{generationRequestId}` Get Images Generation endpoint.


        ## Lifetime of Generated Images


        Generated images will be retained for 6 months after generation.'
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveObjectRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RemoveObjectRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RemoveObjectRequest'
      responses:
        '202':
          description: Returns the request ID for a pending request to refine images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingImageGenerationResponse'
        '403':
          description: Product quota exceeded
        '404':
          description: Either the generation id does not exist, the index is incorrect, or the generation is still pending
        '409':
          description: ConcurrencyConflict
        '400':
          description: InvalidProduct
        '410':
          description: GenerationRequestGone
        '429':
          description: TooManyConcurrentGenerations
      operationId: postV3AiImageGenerationsObjectRemoval
      x-operation-id-source: derived
  /v3/ai/image-generations/background-replacement:
    post:
      tags:
      - AiGenerator
      summary: Replace the background of an existing image
      description: '# AI Generator - Background Replacement


        Background Replacement allows the client application to change the background of an existing Getty Images creative image or an existing generated image through the use of prompt text or color information. Four images will be generated when prompt text is submitted, while one image will be generated when color information is submitted.


        Use of this endpoint is restricted to clients with an AI Generation license product and may result in the deduction of a credit depending on the terms of your license. When generating new images using a reference_asset_id, the reference image must first be licensed (downloaded) through a traditional license product such as Premium Access before the generated image can be downloaded..


        ## The Background Replacement Request


        The BackgroundReplacement Request payload requires one, and only one, reference image (reference_asset_id or reference_generation) and accepts the following optional parameters:


        | Parameter | Purpose |

        |------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

        | `reference_asset_id` | Creative image ID of the image being used as a reference. |

        | `reference_generation` | Generation details of the image being used as a reference. |

        | `prompt` | The primary text used for the generation of the images. |

        | `negative_prompt` | Concepts to _exclude_ from the result. |

        | `background_color` | Color information to use for the background replacement. The format is hexadecimal web colors, _e.g. #0099CC_. |

        | `media_type` | Media type of the results: `photography` or `illustration` |

        | `negative_prompt` | Concepts to _exclude_ from the result. |

        | `product_id` | If you have multiple AI Generation Getty Images products, indicate which one you would like to use for this generation request. If you have multiple products, this property is _required_. Can be retrieved from products (`GET /v3/products`). |

        | `project_code` | If your Getty Images Generative AI product requires project_codes, use of this parameter is required. If your product does not require a project_code, this parameter must be excluded from the request. This is for use by Getty Images customers only (not iStock). The products endpoint (`GET /v3/products`) provides this information. |

