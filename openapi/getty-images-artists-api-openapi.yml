openapi: 3.2.0
info:
  title: Getty Images Artists API
  version: '3'
  description: 'Operations tagged Artists across 2 of this provider''s published API definitions: getty-images-openapi.yml, getty-images-swagger-v3-openapi.json. Each path carries the servers of the definition it was published in.'
security:
- Api-Key: []
- OAuth2: []
tags:
- name: Artists
paths:
  /v3/artists/images:
    get:
      tags:
      - Artists
      summary: Search for images by a photographer
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: artist_name
        in: query
        description: Name of artist for desired images
        schema:
          type:
          - string
          - 'null'
          description: Name of artist for desired images
      - name: fields
        in: query
        description: Comma separated list of fields. Allows restricting which fields are returned. If no fields are selected, the summary_set of fields are returned.
        style: form
        explode: false
        schema:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ArtistsImageSearchFieldValues'
          description: Comma separated list of fields. Allows restricting which fields are returned. If no fields are selected, the summary_set of fields are returned.
      - name: page
        in: query
        description: Identifies page to return. Default page is 1.
        schema:
          type: integer
          description: Identifies page to return. Default page is 1.
          format: int32
          default: 1
      - name: page_size
        in: query
        description: Specifies page size. Default page_size is 10, maximum page_size is 100.
        schema:
          type: integer
          description: Specifies page size. Default page_size is 10, maximum page_size is 100.
          format: int32
          default: 10
      responses:
        '200':
          description: OK
        '400':
          description: InvalidParameterValue
        '401':
          description: Unauthorized
      operationId: getV3ArtistsImages
      x-operation-id-source: derived
  /v3/artists/videos:
    get:
      tags:
      - Artists
      summary: Search for videos by a photographer
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: artist_name
        in: query
        description: Name of artist for desired images
        schema:
          type:
          - string
          - 'null'
          description: Name of artist for desired images
      - name: fields
        in: query
        description: Comma separated list of fields. Allows restricting which fields are returned. If no fields are selected, the summary_set of fields are returned.
        style: form
        explode: false
        schema:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ArtistsVideoSearchFieldValues'
          description: Comma separated list of fields. Allows restricting which fields are returned. If no fields are selected, the summary_set of fields are returned.
      - name: page
        in: query
        description: Identifies page to return. Default page is 1.
        schema:
          type: integer
          description: Identifies page to return. Default page is 1.
          format: int32
          default: 1
      - name: page_size
        in: query
        description: Specifies page size. Default page_size is 10, maximum page_size is 100.
        schema:
          type: integer
          description: Specifies page size. Default page_size is 10, maximum page_size is 100.
          format: int32
          default: 10
      responses:
        '200':
          description: OK
        '400':
          description: InvalidParameterValue
        '401':
          description: Unauthorized
      operationId: getV3ArtistsVideos
      x-operation-id-source: derived
