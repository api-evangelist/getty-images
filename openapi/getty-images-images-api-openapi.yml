components:
  schemas:
    MaxDimensions:
      type: object
      properties:
        height:
          type: integer
          format: int32
        width:
          type: integer
          format: int32
      additionalProperties: false
    ImageDetailFieldValues:
      enum:
      - allowed_use
      - alternative_ids
      - artist
      - artist_title
      - asset_family
      - call_for_image
      - caption
      - city
      - collection_code
      - collection_id
      - collection_name
      - color_type
      - comp
      - comp_webp
      - copyright
      - country
      - credit_line
      - date_camera_shot
      - date_created
      - date_submitted
      - detail_set
      - display_set
      - download_sizes
      - download_product
      - downloads
      - editorial_segments
      - editorial_source
      - entity_details
      - event_ids
      - graphical_style
      - id
      - is_ai_editable
      - istock_collection
      - istock_licenses
      - keywords
      - largest_downloads
      - license_model
      - links
      - max_dimensions
      - object_name
      - orientation
      - people
      - preview
      - product_types
      - quality_rank
      - referral_destinations
      - state_province
      - summary_set
      - thumb
      - title
      - uri_oembed
      type: string
    ImageSearchItemSearchResults:
      type: object
      properties:
        result_count:
          type: integer
          format: int32
        images:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImageSearchItem'
        related_searches:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RelatedSearch'
      additionalProperties: false
    Download:
      type: object
      properties:
        product_id:
          type:
          - string
          - 'null'
        product_type:
          type:
          - string
          - 'null'
        uri:
          type:
          - string
          - 'null'
        agreement_name:
          type:
          - string
          - 'null'
      additionalProperties: false
    Keyword:
      type: object
      properties:
        keyword_id:
          type:
          - string
