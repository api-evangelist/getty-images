openapi: 3.2.0
info:
  title: Getty Images Downloads API
  version: '3'
  description: 'Operations tagged Downloads across 2 of this provider''s published API definitions: getty-images-openapi.yml, getty-images-swagger-v3-openapi.json. Each path carries the servers of the definition it was published in.'
security:
- Api-Key: []
- OAuth2: []
tags:
- name: Downloads
paths:
  /v3/downloads:
    get:
      tags:
      - Downloads
      summary: Returns information about a customer's downloaded assets
      description: 'Returns information about a customer''s previously downloaded assets.


        You''ll need an API key and access token to use this resource.


        This endpoint requires being a Getty Images customer to limit your results to only assets that you have a license to use,

        you need to also include an authorization token in the header of your request.

        Please consult our Authorization FAQ for more information on authorization tokens.'
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: date_from
        in: query
        description: "If specified, selects assets downloaded on or after this date. Dates should be submitted in ISO 8601 format (i.e., YYYY-MM-DD). \nAny hour, minute, second values in the request are not used, unless useTimePart parameter is included.\nDate/times in the response are UTC. Default is 30 days prior to date_to"
        schema:
          type:
          - string
          - 'null'
          description: "If specified, selects assets downloaded on or after this date. Dates should be submitted in ISO 8601 format (i.e., YYYY-MM-DD). \nAny hour, minute, second values in the request are not used, unless useTimePart parameter is included.\nDate/times in the response are UTC. Default is 30 days prior to date_to"
          format: date-time
      - name: date_to
        in: query
        description: 'If specified, selects assets downloaded on or before this date. Dates should be submitted in ISO 8601 format (i.e., YYYY-MM-DD)

          Any hour, minute, second values in the request are not used, unless useTimePart parameter is included.

          Date/times in the response are UTC. Default is current date or 30 days after specified start date, whichever one is earlier.'
        schema:
          type:
          - string
          - 'null'
          description: 'If specified, selects assets downloaded on or before this date. Dates should be submitted in ISO 8601 format (i.e., YYYY-MM-DD)

            Any hour, minute, second values in the request are not used, unless useTimePart parameter is included.

            Date/times in the response are UTC. Default is current date or 30 days after specified start date, whichever one is earlier.'
          format: date-time
      - name: use_time
        in: query
        description: 'If specified, time values provided with date_to or date_from will be used. Time values should be appended to the date value in ISO 8601 format

          i.e.: 2019-09-19T19:30:37 or 2019-09-19 19:30:37.  Time zone can be specified as optional.

          Default value is false'
        schema:
          type: boolean
          description: 'If specified, time values provided with date_to or date_from will be used. Time values should be appended to the date value in ISO 8601 format

            i.e.: 2019-09-19T19:30:37 or 2019-09-19 19:30:37.  Time zone can be specified as optional.

            Default value is false'
          default: false
      - name: page
        in: query
        description: Identifies page to return. Default is 1.
        schema:
          type: integer
          description: Identifies page to return. Default is 1.
          format: int32
          default: 1
      - name: page_size
        in: query
        description: Specifies page size. Default is 30, maximum page_size is 100.
        schema:
          type: integer
          description: Specifies page size. Default is 30, maximum page_size is 100.
          format: int32
          default: 30
      - name: product_type
        in: query
        description: Specifies product type to be included in the previous download results. Product types easyaccess, editorialsubscription, imagepack, and premiumaccess are for GettyImages API keys. Product types royaltyfreesubscription and creditpack are for iStock API keys. To get previous iStockPhoto credit downloads, creditpack must be selected.
        schema:
          $ref: '#/components/schemas/ProductTypeForDownloads'
      - name: company_downloads
        in: query
        description: If specified, returns the list of previously downloaded images for all users in your company. Your account must be enabled for this functionality. Contact your Getty Images account rep for more information. Default is false.
        schema:
          type: boolean
          description: If specified, returns the list of previously downloaded images for all users in your company. Your account must be enabled for this functionality. Contact your Getty Images account rep for more information. Default is false.
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDownloadsResponse'
        '400':
          description: Bad request
        '401':
          description: AuthorizationTokenRequired
        '403':
          description: Forbidden
      operationId: getV3Downloads
      x-operation-id-source: derived
  /v3/downloads/images/{id}:
    post:
      tags:
      - Downloads
      summary: Download an image
      description: 'Use this endpoint to generate download URLs and related data for images you are authorized to download.


        Most product offerings have enforced periodic download limits such as monthly, weekly, and daily. When this operation executes, the count of allowed downloads is decremented by one for the product offering. Once the download limit is reached for a given product offering, no further downloads may be requested for that product offering until the next download period.


        The download limit for a given download period is covered in your product agreement established with Getty Images.


        You''ll need an API key and a Resource Owner Grant or Implicit Grant access token to use this resource.


        ## Auto Downloads

        The `auto_download` request query parameter specifies whether to automatically download the image.


        If the `auto_download` request query parameter is set to _true_, the API will return an HTTP status code 303 *See Other*.Your client code will need to process this response and redirect to the URI specified in the *Location* header to enable you to automatically download the file. The redirection workflow follows the HTTP 1.1 protocol.


        Client Request:


        ```

        https://api.gettyimages.com/v3/downloads/images/[asset_id]?auto_download=true

        ```


        Server Response:


        Your client code should follow redirect (3xx) status codes returned from the URI in the response Location header. More information here: HTTP 1.1 protocol.


        ```

        HTTP/1.1 303 See Other

        Location: https://delivery.gettyimages.com/...

        ```


        If the `auto_download` request query parameter is set to false, the API will return a HTTP status code 200, along with the URI in the response body which can be used to download the image.


        Client Request:


        ```

        https://api.gettyimages.com/v3/downloads/images/[asset_id]?auto_download=false

        ```


        Server Response:


        ```

        HTTP/1.1 200 OK

        {

        "uri": "https://delivery.gettyimages.com/..."

        }

        ```

        ## Downloading Via the Returned URI


        Your client code should follow redirect (3xx) status codes returned from the URI in the response. More information here: HTTP 1.1 protocol.


        The URI returned by this call should be considered opaque and the format could change at any time.

        In order to get the filename, length or file type, the response headers must be inspected. An example

        response follows:


        ```

        content-length: 33959979

        content-type: image/jpeg

        content-disposition: attachment; filename=GettyImages-1167612765.jpg

        ```


        The `content-disposition` header must be parsed to get a usable filename.


        ## Download URI expiration


        Download URIs are _**only valid for 24 hours**_, starting from the moment they are returned from this call.'
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      - name: id
        in: path
        description: "<remarks>\n                    Id of image to download.\n                </remarks>"
        required: true
        schema:
          type:
          - string
          - 'null'
          description: "<remarks>\n                    Id of image to download.\n                </remarks>"
      - name: auto_download
        in: query
        description: "<remarks>\n                    Specifies whether to auto-download the image. If true is specified, a 303 SeeOther status is returned with a\n                    Location header set to the location of the image.\n                    If false is specified, the download URI will be returned in the response message. Default is true.\n                </remarks>"
        schema:
          type: boolean
          description: "<remarks>\n                    Specifies whether to auto-download the image. If true is specified, a 303 SeeOther status is returned with a\n                    Location header set to the location of the image.\n                    If false is specified, the download URI will be returned in the response message. Default is true.\n                </remarks>"
          default: true
      - name: file_type
        in: query
        description: "<remarks>\n                    File Type expressed with three character file extension.\n                </remarks>"
        schema:
          $ref: '#/components/schemas/DownloadFileType'
      - name: height
        in: query
        description: "<remarks>\n                    Specifies the pixel height of the particular image to download.\n                    Available heights can be found in the images/{ids} response for the specific image.\n                    If left blank, it will return the largest available size.\n                </remarks>"
        schema:
          type:
          - string
          - 'null'
          description: "<remarks>\n                    Specifies the pixel height of the particular image to download.\n                    Available heights can be found in the images/{ids} response for the specific image.\n                    If left blank, it will return the largest available size.\n                </remarks>"
      - name: product_id
        in: query
        description: "<remarks>\n                    Identifier of the instance for the selected product offering type.\n                </remarks>"
        schema:
          type:
          - integer
          - 'null'
          description: "<remarks>\n                    Identifier of the instance for the selected product offering type.\n                </remarks>"
          format: int32
      - name: product_type
        in: query
        description: "<remarks>\n                    Product types easyaccess, editorialsubscription, imagepack, and premiumaccess are for GettyImages API keys. Product types royaltyfreesubscription and creditpack are for iStock API keys. Default product type for iStock API keys is creditpack.\n                </remarks>"
        schema:
          $ref: '#/components/schemas/ProductTypeForDownloads'
      - name: use_team_credits
        in: query
        description: Specifies whether to download the image with iStock Team Credits. Only applicable to iStock API keys authenticated with a user that has Team Credits. Blank is the same as False.
        schema:
          type:
          - boolean
          - 'null'
          description: Specifies whether to download the image with iStock Team Credits. Only applicable to iStock API keys authenticated with a user that has Team Credits. Blank is the same as False.
          default: false
      requestBody:
        description: "<remarks>\n                    Additional information required from specific customers when downloading. \n                    Only users who have been set up with a project code by Getty Images Sales need to use this field.\n                </remarks>"
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PremiumAccessDownloadData'
      responses:
        '200':
          description: OK
        '303':
          description: See Other
        '400':
          description: MissingRequiredQueryParameters
        '401':
          description: AuthorizationTokenRequired
        '403':
          description: OverageLimitReached
        '404':
          description: ImageNotFound
      operationId: postV3DownloadsImagesById
      x-operation-id-source: derived
  /v3/downloads/videos/{id}:
