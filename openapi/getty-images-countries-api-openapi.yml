openapi: 3.2.0
info:
  title: Getty Images Countries API
  version: '3'
  description: 'Operations tagged Countries across 2 of this provider''s published API definitions: getty-images-openapi.yml, getty-images-swagger-v3-openapi.json. Each path carries the servers of the definition it was published in.'
security:
- Api-Key: []
- OAuth2: []
tags:
- name: Countries
paths:
  /v3/countries:
    get:
      tags:
      - Countries
      summary: Gets countries codes and names
      description: 'Returns a list of country objects that contains country name, two letter ISO abbreviation and three letter ISO abbreviation.


        You''ll need an API key and access token to use this resource.'
      parameters:
      - name: Accept-Language
        in: header
        description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
        schema:
          type: string
          description: 'Provide a header to specify the language of result values. Supported values: cs (iStock only), de, en-GB, en-US, es, fi (iStock only), fr, hu (iStock only), id (iStock only), it, ja, ko (creative assets only), nl, pl (creative assets only), pt-BR, pt-PT, ro (iStock only), ru (creative assets only), sv, th (iStock only), tr, uk (iStock only), vi (iStock only), zh-HK (creative assets only).'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesList'
        '401':
          description: Unauthorized
      operationId: getV3Countries
      x-operation-id-source: derived
components:
  schemas:
    CountriesList:
      type: object
      properties:
        countries:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Country'
      additionalProperties: false
    Country:
      type: object
      properties:
        iso_alpha_2:
          type:
          - string
          - 'null'
        iso_alpha_3:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    GettyImages.Services.Connect.Public.Models.Countries.CountriesList:
      type: object
      properties:
        countries:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GettyImages.Services.Connect.Public.Models.Countries.Country'
      additionalProperties: false
    GettyImages.Services.Connect.Public.Models.Countries.Country:
      type: object
      properties:
        iso_alpha_2:
          type:
          - string
          - 'null'
        iso_alpha_3:
          type:
