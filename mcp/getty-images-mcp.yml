tool_discovery:
  gated: true
  note: >-
    tools/list requires an authenticated session, so the real tool names and inputSchemas
    could not be captured. Getty explicitly asks clients NOT to hard-code tool names or
    parameters and to discover them at call time, so no tool list is asserted here. The
    capability areas below are the provider's own prose description of what the server
    offers, NOT tool names — do not treat them as an inputSchema-bearing manifest.
capability_areas:
- area: authentication
  description: Agent retrieves a token via the OAuth 2.0 client-credentials or authorization-code grant.
- area: search
  description: Searching for images and videos from the organization's Getty Images license agreement.
- area: asset_metadata
  description: Retrieving asset metadata.
- area: download
  description: Downloading image and video files.
audience: >-
  Getty Images subscription customers (Premium Access, Editorial Subscription) adding search
  and download to AI workflows, and business partners reselling catalog access to their own
  platform customers.
