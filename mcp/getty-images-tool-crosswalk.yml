confidence_note: >-
  THIS IS NOT A TOOL LIST. The Getty Images MCP server's tools/list is auth-gated (HTTP 401,
  probed 2026-09-12) and the provider publishes no llms.txt and no static tool inventory, so
  the real tool names and inputSchemas are unknown. What Getty DOES publish is a four-item
  prose description of what the server does. Each row below binds one of those published
  capability areas to the REST operations that back it, so a reader can see the real input
  contract for the underlying operation. Every binding is confidence: low or medium for that
  reason, and `tool` values are capability-area labels, not asserted tool names. Getty's own
  guidance reinforces this: "please do not hard code to specific tools and/or parameters …
  let your agent discover what is available at the time it's needed."
